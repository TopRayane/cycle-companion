<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8e8ee" />
  <title>همراه ماهانه</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- صفحه خوش‌آمد و دریافت نام -->
  <section id="welcome-screen" class="screen active">
    <div class="welcome-card">
      <div class="welcome-emoji">🌸</div>
      <h1>سلام رفیق!</h1>
      <p>من اینجام تا توی این مسیر کنارت باشم. اول بگو چطور صدات کنم؟</p>
      <input type="text" id="name-input" placeholder="اسمت رو بنویس..." maxlength="20" />
      <button id="start-btn" class="btn-primary">شروع کنیم</button>
    </div>
  </section>

  <!-- اپ اصلی -->
  <section id="app-screen" class="screen">
    <header class="app-header">
      <div>
        <h2 id="greeting">سلام <span id="user-name-display">رفیق</span> 🌸</h2>
        <p id="phase-label" class="phase-label">در حال محاسبه...</p>
      </div>
      <button id="settings-btn" class="icon-btn" aria-label="تنظیمات">⚙️</button>
    </header>

    <main class="app-main">
      <!-- حلقه چرخه -->
      <div class="cycle-ring-wrapper">
        <svg id="cycle-ring" viewBox="0 0 200 200"></svg>
        <div id="cycle-center" class="cycle-center">
          <span id="cycle-day">—</span>
          <small>روز چرخه</small>
        </div>
      </div>

      <!-- کارت پیش‌بینی -->
      <div class="card prediction-card">
        <div class="prediction-item">
          <span class="prediction-icon">📅</span>
          <div>
            <small>دوره بعدی</small>
            <strong id="next-period-date">—</strong>
          </div>
        </div>
        <div class="prediction-item">
          <span class="prediction-icon">💚</span>
          <div>
            <small>پنجره باروری</small>
            <strong id="fertility-window">—</strong>
          </div>
        </div>
      </div>

      <!-- ثبت دوره -->
      <div class="card">
        <h3>ثبت دوره</h3>
        <form id="period-form" class="period-form">
          <label>
            شروع
            <input type="date" id="start-date" required />
          </label>
          <label>
            پایان
            <input type="date" id="end-date" required />
          </label>
          <button type="submit" class="btn-primary btn-small">ثبت</button>
        </form>
      </div>

      <!-- علائم روزانه -->
      <div class="card">
        <h3>امروز چطوری؟</h3>
        <div id="symptom-grid" class="symptom-grid"></div>
      </div>

      <!-- یادداشت -->
      <div class="card">
        <h3>یادداشت‌ها</h3>
        <textarea id="note-input" rows="3" placeholder="هر چی تو ذهنته بنویس..."></textarea>
        <button id="save-note-btn" class="btn-primary btn-small">ذخیره</button>
        <ul id="note-list" class="note-list"></ul>
      </div>

      <!-- نکات و راهکارها -->
      <div class="card">
        <h3>نکات این دوره</h3>
        <div id="tips-container" class="tips-container"></div>
      </div>

      <!-- تاریخچه -->
      <div class="card">
        <h3>دوره‌های قبلی</h3>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </main>

    <!-- دکمه‌های پایین -->
    <nav class="bottom-nav">
      <button id="nav-home" class="nav-btn active">🏠<span>خانه</span></button>
      <button id="nav-chat" class="nav-btn">💬<span>چت هوشمند</span></button>
      <button id="nav-companion" class="nav-btn">🤗<span>همدم</span></button>
    </nav>

    <!-- پنل چت -->
    <div id="chat-panel" class="chat-panel">
      <div class="chat-header">
        <span id="chat-title">چت هوشمند</span>
        <button id="close-chat" class="icon-btn">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="پیامت رو بنویس..." />
        <button id="send-chat" class="btn-primary btn-small">ارسال</button>
      </div>
    </div>

    <!-- تنظیمات -->
    <div id="settings-panel" class="settings-panel">
      <div class="chat-header">
        <span>تنظیمات</span>
        <button id="close-settings" class="icon-btn">✕</button>
      </div>
      <div class="settings-content">
        <label>
          نام نمایشی
          <input type="text" id="settings-name" maxlength="20" />
        </label>
        <label>
          طول چرخه (روز)
          <input type="number" id="settings-cycle-length" min="20" max="45" value="28" />
        </label>
        <label>
          طول دوره (روز)
          <input type="number" id="settings-period-length" min="1" max="10" value="5" />
        </label>
        <button id="save-settings" class="btn-primary">ذخیره تنظیمات</button>
        <button id="reset-app" class="btn-danger">پاک کردن همه داده‌ها</button>
      </div>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cycle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
